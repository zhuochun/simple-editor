<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Editor: Hierarchical Writing Tool</title>
    <meta name="description" content="Simple Editor: The ultimate hierarchical writing tool for novelists, writers, and researchers. Organize nested notes and craft complex documents with ease and visual clarity.">

    <meta property="og:title" content="Simple Editor: Nested Notes - Hierarchical Writing Tool">
    <meta property="og:description" content="Simple Editor: The ultimate hierarchical writing tool for novelists, writers, and researchers.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.bicrement.com/simple-editor/">

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" />

</head>
<body>
    <div id="sidebar">
        <div class="sidebar-top-actions">
            <button id="import-project-btn" title="Import Project" aria-label="Import Project">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 19h14"/></svg>
            </button>
            <button id="add-project-btn" title="Add New Project">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>
                <span>New Project</span>
            </button>
        </div>
        <div id="project-list">
            <!-- Project list will be populated here -->
        </div>
        <div id="info-links-container">
            <a href="https://x.com/intent/post?text=A%20non-linear,%20hierarchical%20approach%20to%20drafting%20and%20organizing%20complex%20documents%20https://www.bicrement.com/simple-editor/" target="_blank" rel="noopener noreferrer">Feedback on X</a>
            (<a href="https://x.com/zhuochun" target="_blank" rel="noopener noreferrer">@zhuochun</a>)
        </div>
        <div id="ai-settings-container">
            <h3 id="ai-settings-title">AI Settings <a href="https://github.com/zhuochun/simple-editor" target="_blank" rel="noopener noreferrer" title="How to Setup AI Configurations">(Guide)</a></h3>
            <div class="ai-setting">
                <label for="ai-provider">Provider</label>
                <select id="ai-provider">
                    <option value="openai">OpenAI · Responses</option>
                    <option value="openrouter">OpenRouter · Chat Completions</option>
                    <option value="custom">Custom</option>
                </select>
            </div>
            <div class="ai-setting">
                <label for="ai-model-name">Model</label>
                <input type="text" id="ai-model-name" placeholder="gpt-5.6-sol" autocomplete="off">
            </div>
            <div class="ai-setting">
                <label for="ai-reasoning-effort">Thinking effort</label>
                <select id="ai-reasoning-effort">
                    <option value="none">None</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                    <option value="xhigh">Extra high</option>
                    <option value="max">Maximum</option>
                </select>
            </div>
            <div class="ai-setting">
                <label for="ai-api-key">API key</label>
                <input type="password" id="ai-api-key" placeholder="Stored only in this browser" autocomplete="off">
            </div>
            <details id="ai-advanced-settings">
                <summary>Advanced</summary>
                <div class="ai-setting">
                    <label for="ai-protocol">API protocol</label>
                    <select id="ai-protocol">
                        <option value="responses">Responses API</option>
                        <option value="chat-completions">Chat Completions</option>
                    </select>
                </div>
                <div class="ai-setting">
                    <label for="ai-provider-url">Endpoint</label>
                    <input type="url" id="ai-provider-url" placeholder="https://..." autocomplete="off">
                </div>
            </details>
            <div class="ai-settings-actions">
                <button type="button" id="ai-save-settings" class="primary">Save</button>
                <button type="button" id="ai-test-settings">Test</button>
            </div>
            <p id="ai-settings-status" role="status" aria-live="polite"></p>
            <p class="ai-privacy-note">Project context is sent only when you run an AI action. Test sends no project content.</p>
        </div>
    </div>
    <div id="resizer"></div>
    <div id="main-content">
        <div id="ai-job-status" role="status" aria-live="polite" hidden>
            <span class="ai-job-message"></span>
            <div class="ai-job-actions"></div>
        </div>
        <div id="app">
            <div class="columns-container" id="columnsContainer">
                <!-- Columns will be dynamically generated here -->
            </div>
        </div>
    </div>

    <!-- script.js imports the application modules through the module graph. -->
    <script type="module" src="script.js"></script>
</body>
</html>
